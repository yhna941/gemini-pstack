description = "Write pstack model choices into the Gemini CLI files it reads."
prompt = """
The SessionStart hook already injected the pstack adapter text and the absolute extension root. Follow that injected text. The adapter wins when a Cursor name and a Gemini name differ. Do not read a workspace-relative docs/harness/gemini-cli.md. Run scripts from <extension root>/scripts using that absolute path. Then follow the setup-pstack skill. Pass --budget lite, large, medium, or small when the words below name one of those budgets. lite sets gemini-3.5-flash-lite and pstack.lite. With no budget, pass --budget large and say that you used the default. Run node <extension root>/scripts/write-pstack-models.mjs. Do not edit ~/.gemini/GEMINI.md or ~/.gemini/settings.json by hand in this turn.

{{args}}
"""
