name: review

on:
  pull_request:

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @google/gemini-cli@0.70.0
      - run: node scripts/review-pr.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
